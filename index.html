<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小型漆线雕工坊管理</title>
  <style>
    :root {
      --bg: #eef3f0;
      --panel: #ffffff;
      --ink: #1e2624;
      --muted: #62706b;
      --line: #ccd8d2;
      --teal: #1f6b68;
      --red: #a43f42;
      --amber: #aa7a24;
      --violet: #665c93;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); background: #fbfdfb; display: flex; justify-content: space-between; gap: 18px; align-items: end; }
    h1 { margin: 0; font-size: 26px; letter-spacing: 0; }
    .sub, .meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
    main { padding: 20px 28px 34px; display: grid; gap: 18px; }
    button, input, select, textarea { font: inherit; border-radius: 6px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); padding: 9px 10px; background: #fff; color: var(--ink); }
    textarea { min-height: 68px; resize: vertical; }
    button { border: 0; background: var(--teal); color: #fff; padding: 9px 11px; cursor: pointer; min-height: 38px; }
    button.secondary { background: #5d6764; }
    button.warn { background: var(--amber); }
    button.danger { background: var(--red); }
    button.violet { background: var(--violet); }
    button.small { min-height: 30px; padding: 4px 10px; width: auto; }
    label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
    .top { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .panel h2 { margin: 0 0 12px; font-size: 17px; }
    form { display: grid; gap: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
    .lists { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
    .mini { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fbfdfb; min-height: 118px; }
    .mini h3 { margin: 0 0 8px; font-size: 14px; }
    .riskchips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: #e7eeea; color: #40504b; border: 1px solid var(--line); }
    .chip-red { background: #f7e7e7; color: var(--red); border-color: #e2c1c2; }
    .chip-amber { background: #f7efdd; color: var(--amber); border-color: #e3d2a8; }
    .chip-violet { background: #ece9f5; color: var(--violet); border-color: #cfc9e4; }
    .item { border: 1px solid #d7e0dc; border-left: 4px solid var(--teal); background: #fff; border-radius: 7px; padding: 9px; margin-bottom: 8px; cursor: pointer; }
    .item.overdue { border-left-color: var(--red); }
    .item.packed { border-left-color: var(--violet); }
    .item.signed { border-left-color: #2f7d50; }
    .pack-line { margin-top: 5px; }
    .board { display: grid; grid-template-columns: repeat(7, minmax(190px, 1fr)); gap: 12px; overflow-x: auto; }
    .col { background: #f9fbf9; border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 320px; }
    .col h3 { display: flex; justify-content: space-between; margin: 0 0 10px; font-size: 15px; }
    .actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .actions button { flex: 1; min-width: 82px; font-size: 12px; padding: 7px 8px; }
    dialog { border: 1px solid var(--line); border-radius: 8px; width: min(620px, calc(100vw - 24px)); padding: 0; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
    .dialog-body { padding: 16px; display: grid; gap: 10px; }
    .dialog-body h2 { margin: 0; font-size: 18px; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
    .hidden { display: none !important; }
    .form-error { color: var(--red); font-size: 13px; min-height: 16px; }
    .warn-box { background: #f7efdd; border: 1px solid #e3d2a8; color: #7a5716; font-size: 13px; border-radius: 6px; padding: 8px 10px; }
    .pack-row { display: grid; grid-template-columns: 1fr 110px auto; gap: 8px; margin-bottom: 8px; }
    .kv { margin: 6px 0; padding-left: 18px; }
    .kv-grid { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; font-size: 13px; margin: 6px 0; }
    .status-pill { color: var(--teal); }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
    .tag-active { background: #ece9f5; color: var(--violet); }
    .tag-signed { background: #e3f1e8; color: #2f7d50; }
    .tag-voided { background: #f7e7e7; color: var(--red); }
    .hist { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; background: #fbfdfb; font-size: 13px; }
    .hist-block h4 { margin: 8px 0 4px; font-size: 13px; }
    .void-reason { color: var(--red); }
    .receipt-box { border: 1px dashed #2f7d50; background: #eef7f1; color: #235c3b; border-radius: 6px; padding: 8px 10px; font-size: 13px; margin: 6px 0; }
    .logs { word-break: break-all; }
    .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; transition: all .2s; padding: 10px 16px; border-radius: 8px; color: #fff; font-size: 13px; z-index: 99; max-width: 80vw; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.ok { background: #2f7d50; }
    .toast.err { background: var(--red); }
    @media (max-width: 980px) {
      header { display: block; padding: 18px; }
      main { padding: 16px; }
      .top, .lists, .toolbar { grid-template-columns: 1fr; }
      .grid2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>小型漆线雕工坊管理</h1>
      <div class="sub">贴线、阴干、上金粉、待交付 · 包装清单与签收闭环</div>
    </div>
    <button id="exportBtn" class="secondary">导出 JSON</button>
  </header>

  <main>
    <section class="top">
      <form id="workForm" class="panel">
        <h2>新增作品</h2>
        <div class="grid2">
          <label>胎体材质<input name="base" required placeholder="脱胎漆器"></label>
          <label>纹样主题<input name="theme" required placeholder="缠枝莲"></label>
        </div>
        <div class="grid2">
          <label>线条粗细<select name="line"><option>细线</option><option>中线</option><option>粗线</option><option>混合线</option></select></label>
          <label>贴线进度<input name="progress" type="number" min="0" max="100" value="25"></label>
        </div>
        <div class="grid2">
          <label>阴干日期<input name="dryDate" type="date" required></label>
          <label>计划交付日期<input name="delivery" type="date" required></label>
        </div>
        <div class="grid2">
          <label>金粉处理状态<select name="gold"><option>未处理</option><option>试扫粉</option><option>已上金粉</option></select></label>
          <label>当前状态<select name="status"><option>贴线中</option><option>待阴干</option><option>上金粉</option><option selected>待交付</option></select></label>
        </div>
        <label>缺陷位置<input name="defect" placeholder="右下花瓣断线（可留空）"></label>
        <label>备注<textarea name="note" placeholder="客户偏好、修补记录"></textarea></label>
        <button type="submit">加入工坊</button>
      </form>

      <section class="panel">
        <h2>今日与风险</h2>
        <div id="riskChips" class="riskchips"></div>
        <div class="lists">
          <div class="mini">
            <h3>今日待阴干</h3>
            <div id="todayDry"></div>
          </div>
          <div class="mini">
            <h3>缺陷作品</h3>
            <div id="defectList"></div>
          </div>
          <div class="mini">
            <h3>最近签收</h3>
            <div id="deliveryList"></div>
          </div>
        </div>
        <div class="toolbar">
          <label>主题筛选<input id="themeFilter" placeholder="输入纹样"></label>
          <label>状态筛选<select id="statusFilter"></select></label>
          <label>排序<select id="sortMode"><option value="delivery">按交付日期</option><option value="dry">按阴干日期</option></select></label>
          <button id="clearFilters" class="secondary">清空</button>
        </div>
        <div id="board" class="board"></div>
      </section>
    </section>
  </main>

  <!-- 作品详情：包装清单 / 签收 / 返工 / 缺陷历史全程留痕 -->
  <dialog id="detailDialog">
    <div class="dialog-body">
      <h2 id="detailTitle">作品详情</h2>
      <div id="detailContent" class="meta"></div>
      <label>记录缺陷（追加；包装中将使清单失效并退回待交付）
        <input id="defectInput" placeholder="断线/翘线位置">
      </label>
      <div class="actions">
        <button id="saveDefect" class="warn">保存缺陷</button>
        <button id="closeDetail" class="secondary">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- 建立包装清单 -->
  <dialog id="packDialog">
    <div class="dialog-body">
      <h2>建立包装清单</h2>
      <div id="packWarn" class="warn-box hidden"></div>
      <div id="packItems"></div>
      <button type="button" id="addPackRow" class="secondary small">＋ 增加一项</button>
      <div class="actions">
        <button id="submitPack" class="violet">完成包装，进入待签收</button>
        <button id="cancelPack" class="secondary">取消</button>
      </div>
    </div>
  </dialog>

  <!-- 签收：收货人 / 实际交付日期 / 唯一签收号，缺项拒绝 -->
  <dialog id="signDialog">
    <div class="dialog-body">
      <h2>作品签收</h2>
      <div class="meta">本次包装内容：<ul id="signPackSummary" class="kv"></ul></div>
      <label>收货人（必填）<input id="signReceiver" placeholder="收货人姓名/单位"></label>
      <div class="grid2">
        <label>实际交付日期（必填）<input id="signDate" type="date"></label>
        <label>签收号（必填，全工坊唯一）<input id="signReceipt" placeholder=""></label>
      </div>
      <div id="signError" class="form-error"></div>
      <div class="actions">
        <button id="submitSign" class="violet">确认签收</button>
        <button id="cancelSign" class="secondary">取消</button>
      </div>
    </div>
  </dialog>

  <!-- 签收后补做修复：只追加返工记录 -->
  <dialog id="reworkDialog">
    <div class="dialog-body">
      <h2>签收后补做修复</h2>
      <div class="meta">原签收记录与缺陷历史会保留；返工完成后回到待交付，可重新包装并再次签收。</div>
      <label>修复说明（必填）<textarea id="reworkReason" placeholder="补做部位与原因"></textarea></label>
      <div id="reworkError" class="form-error"></div>
      <div class="actions">
        <button id="submitRework" class="danger">登记返工</button>
        <button id="cancelRework" class="secondary">取消</button>
      </div>
    </div>
  </dialog>

  <!-- 编辑作品资料 -->
  <dialog id="editDialog">
    <form id="editForm" class="dialog-body" onsubmit="return false">
      <h2>调整作品资料</h2>
      <div id="editWarn" class="warn-box hidden"></div>
      <div class="grid2">
        <label>胎体材质<input name="base"></label>
        <label>纹样主题<input name="theme"></label>
      </div>
      <div class="grid2">
        <label>线条粗细<select name="line"><option>细线</option><option>中线</option><option>粗线</option><option>混合线</option></select></label>
        <label>贴线进度<input name="progress" type="number" min="0" max="100"></label>
      </div>
      <div class="grid2">
        <label>阴干日期<input name="dryDate" type="date"></label>
        <label>计划交付日期<input name="delivery" type="date"></label>
      </div>
      <div class="grid2">
        <label>金粉状态<select name="gold"><option>未处理</option><option>试扫粉</option><option>已上金粉</option></select></label>
        <label>备注<input name="note"></label>
      </div>
      <div class="actions">
        <button id="submitEdit" type="button">保存调整</button>
        <button id="cancelEdit" type="button" class="secondary">取消</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="js/rules.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
